<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e3a2b" />
      <stop offset="60%" stop-color="#14261d" />
      <stop offset="100%" stop-color="#0d1812" />
    </radialGradient>
  </defs>

  <!-- Fond vert forêt -->
  <rect width="600" height="600" fill="url(#bgGlow)" />

  <!-- Bordure intérieure discrète -->
  <rect x="20" y="20" width="560" height="560" rx="6" fill="none" stroke="rgba(246,241,228,0.08)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Badge d'alerte avec point d'exclamation -->
  <g transform="translate(300, 250)">
    <!-- Cercles -->
    <circle r="72" fill="#1b3327" stroke="#d49a37" stroke-width="4" />
    <circle r="86" fill="none" stroke="rgba(212,154,55,0.3)" stroke-width="1.5" stroke-dasharray="6 5" />

    <!-- Symbole '!' -->
    <path d="M -6.5 -36 L 6.5 -36 L 4 10 L -4 10 Z" fill="#d49a37" />
    <circle cx="0" cy="28" r="7" fill="#d49a37" />
  </g>

  <!-- Textes compacts et centrés (jamais tronqués) -->
  <text x="300" y="385" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Playfair Display', serif, system-ui" font-size="20" font-weight="700" letter-spacing="3" fill="#f6f1e4">PHOTO EN ATTENTE</text>
  <text x="300" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="1.5" fill="rgba(246,241,228,0.65)">Emplacement réservé</text>
</svg>
